{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <!-- HEADER & NAVIGATION -->
    <header class="site-header">
        <div class="container">
            <a href="{%  url 'main:show_main' %}" class="brand">
                <img src="{% static 'img/logo.svg' %}" alt="Delitha Logo" class="logo">
            </a>
            <button class="mobile-menu-toggle" aria-label="Toggle Menu" id="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="site-nav" class="site-nav">
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experiences</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
                <a href="{% url 'main:show_blog' %}">Blog</a>
                {% if user.is_authenticated %}
                    <span class="nav-user">{{ user.username }}</span>
                    <a href="{% url 'main:logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'main:login' %}">Login</a>
                    <a href="{% url 'main:register' %}">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true, // whether animation should happen only once - while scrolling down
            offset: 100, // offset (in px) from the original trigger point
            duration: 800, // values from 0 to 3000, with step 50ms
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.getElementById("mobile-menu-toggle");
            const nav = document.getElementById("site-nav");
            if (toggle && nav) {
                toggle.addEventListener("click", function () {
                    nav.classList.toggle("is-open");
                });
            }
        });
    </script>
</body>

</html>
