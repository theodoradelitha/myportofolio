{% load static %}
<!-- PROJECTS SECTION -->
<section class="projects" id="projects">
    <h2 class="mobile-projects-title" data-aos="fade-up">My Projects</h2>
    <div class="container projects-container">

        <div class="folder-wrapper" id="projects-folder" data-aos="zoom-in-up" data-aos-duration="1000">
            <!-- Back Folder -->
            <img src="{% static 'img/blank-folder.svg' %}" alt="Projects Folder Back" class="folder-back">

            <!-- Folder Content -->
            <div class="folder-content">
                <!-- Swiper -->
                <div class="swiper projectsSwiper">
                    <div class="swiper-wrapper">

                        {% for project in projects_list %}
                        <!-- Dynamic Slide -->
                         <div class="swiper-slide">
                            <div class="project-card">
                                <div class="project-card-header">
                                    <div class="stars-left">
                                        <img src="{% static 'img/projects-star.svg' %}" alt="*" class="star-large">
                                        <img src="{% static 'img/projects-star.svg' %}" alt="*" class="star-small">
                                    </div>
                                    <h3 class="project-title">
                                        <a href="{% if project.demo_link %}{{ project.demo_link }}{% else %}#{% endif %}" target="_blank">
                                            {{ project.title }}
                                        </a>
                                    </h3>
                                    <div class="stars-right">
                                        <img src="{% static 'img/projects-star.svg' %}" alt="*" class="star-small">
                                        <img src="{% static 'img/projects-star.svg' %}" alt="*" class="star-large">
                                    </div>
                                </div>

                                <div class="project-card-body">
                                    <!-- placeholder image -->
                                     <div class="project-image-placeholder">
                                        <img src="{% static 'img/blank-folder.svg' %}" alt="{{ project.title }}" class="project-image">
                                     </div>

                                     <div class="project-info">
                                        <h4 class="project-subtitle">About</h4>
                                        <p class="project-desc">{{ project.description }}</p>

                                        <h4 class="project-tech-title">Tech Stack</h4>
                                        <ul class="project-tech-list">
                                            <!-- displays the string from tech_stack model field -->
                                             <li>{{ project.tech_stack }}</li>
                                        </ul>
                                     </div>
                                </div>
                            </div>
                         </div>

                         {% empty %}
                         <!-- required empty state -->
                          <div class="swiper-slide">
                            <div class="project-card" style="display: flex; justify-content: center; align-items: center; min-height: 300px;">
                                <p class="empty-state" style="color: var(--text-muted); font-weight: 500;">
                                    No projects have been added yet.
                                </p>
                            </div>
                          </div>
                          {% endfor %}

                    </div>

                    <!-- Pagination -->
                    <div class="swiper-pagination"></div>
                    <!-- Navigation -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>

            <!-- Cover Folder -->
            <img src="{% static 'img/clickable-folder.svg' %}" alt="Clickable Projects Folder" class="folder-front">
        </div>

    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Folder open animation
        const folder = document.getElementById("projects-folder");
        if (folder) {
            folder.addEventListener("click", function (e) {
                // Prevent closing when interacting with the slider inside
                if (!this.classList.contains("is-open")) {
                    this.classList.add("is-open");
                }
            });
        }

        // Initialize Swiper
        const swiper = new Swiper(".projectsSwiper", {
            loop: true,
            grabCursor: true,
            spaceBetween: 50, // Gap between slides
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });
    });
</script>
