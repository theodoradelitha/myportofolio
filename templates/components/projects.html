{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- PROJECTS SECTION -->
<section class="projects" id="projects">
    <!-- Background stars -->
    <img src="{% static 'img/bg-star-blur.svg' %}" class="star-bg star-projects-1 floating-star"
        style="animation-delay: 1.5s;" alt="" aria-hidden="true">
    <img src="{% static 'img/bg-star-blur.svg' %}" class="star-bg star-projects-2 floating-star"
        style="animation-delay: 0.3s;" alt="" aria-hidden="true">
    <img src="{% static 'img/bg-star-blur.svg' %}" class="star-bg star-projects-3 floating-star"
        style="animation-delay: 2.1s;" alt="" aria-hidden="true">
    <img src="{% static 'img/bg-star-blur.svg' %}" class="star-bg star-projects-4 floating-star"
        style="animation-delay: 0.8s;" alt="" aria-hidden="true">

    <div class="project-header-controls container" data-aos="fade-up">
        <h2 class="section-title text-center">My Projects</h2>

        <div class="project-controls-row">
            <form id="project-search-form" class="project-search">
                <input type="search"
                       id="search-input"
                       name="title"
                       value="{{ title_query }}"
                       placeholder="Search project name..."
                       class="project-search__input"
                       aria-label="Search by project name">
                <button type="submit" class="button">Search</button>
            </form>

            <button class="button button-secondary" onclick="showToast('System Notification', 'Project loaded successfully!', 'success')">
                Test Toast Notification
            </button>

            {% if perms.main.add_project %}  
                <a href="{% url 'main:create_project' %}"
                class="button project-add-button">
                    <span aria-hidden="true">+</span>
                    Add Project
                </a>
            {% endif %}                
        </div>
    </div>

    <div class="container projects-container">
        <div class="folder-wrapper" id="projects-folder" data-aos="zoom-in-up" data-aos-duration="1000">
            <!-- Back Folder -->
            <img src="{% static 'img/blank-folder.svg' %}" alt="Projects Folder Back" class="folder-back">

            <!-- Folder Content -->
            <div class="folder-content">
                <!-- Loading State -->
                <div id="loading" class="empty-state hide">
                    <p>Loading projects...</p>
                </div>

                <!-- Error State -->
                <div id="error" class="empty-state hide">
                    <p>Failed to load project data. Please try again.</p>
                </div>

                <!-- Empty State -->
                <div id="empty" class="empty-state hide">
                    <p>No projects have been added or found yet.</p>
                </div>

                <!-- Swiper -->
                <div class="swiper projectsSwiper">
                    <!-- Project Grid / Swiper Wrapper -->
                    <div id="grid" class="swiper-wrapper">
                    </div>
                    <!-- Pagination -->
                    <div class="swiper-pagination"></div>
                    <!-- Navigation -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>

            <!-- Cover Folder -->
            <img src="{% static 'img/clickable-folder.svg' %}" alt="Clickable Projects Folder" class="folder-front">
        </div>
    </div>
</section>

<script>
    // Configuration
    const BASE_PROJECTS_ENDPOINT = "{% url 'main:get_projects_json' %}";
    const CAN_CHANGE = "{{ perms.main.change_project|yesno:'true,false' }}" === "true";
    const IS_AUTHENTICATED = "{{ user.is_authenticated|yesno:'true,false' }}" === "true";
    let projectsAbortController;

    // DOM elements
    const loadingState = document.getElementById('loading');
    const errorState = document.getElementById('error');
    const emptyState = document.getElementById('empty');
    const gridContainer = document.getElementById('grid');
    const searchForm = document.getElementById('project-search-form');
    const searchInput = document.getElementById('search-input');
    const swiperContainer = document.querySelector('.projectsSwiper');

    const SEARCH_DEBOUNCE_DELAY = 300;
    let searchDebounceTimer;
    // Show/hide page sections
    function displayPageSection({ showLoading = false, showError = false, showEmpty = false, showGrid = false }) {
        if(loadingState) loadingState.classList.toggle('hide', !showLoading);
        if(errorState) errorState.classList.toggle('hide', !showError);
        if(emptyState) emptyState.classList.toggle('hide', !showEmpty);
        if(gridContainer) gridContainer.classList.toggle('hide', !showGrid);
        
        // Hide/show the swiper container appropriately
        if (swiperContainer) {
            swiperContainer.style.display = showGrid ? 'block' : 'none';
        }
    }

    // Build a project card element
    function buildProjectCardElement(item) {
        const project = item.fields;
        const projectId = item.pk;

        const slideElement = document.createElement('div');
        slideElement.className = 'swiper-slide';

        const demoLink = project.demo_link ? project.demo_link : '#';
        const imageSrc = project.image ? `{% static '' %}${project.image}` : `{% static 'img/blank-folder.svg' %}`;
        
        const deleteUrl = "{% url 'main:delete_project' '00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000', projectId);
        const editUrl = "{% url 'main:update_project' '00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000', projectId);
        const starUrl = "{% url 'main:toggle_star_project' '00000000-0000-0000-0000-000000000000' %}".replace('00000000-0000-0000-0000-000000000000', projectId);

        const starFormHtml = IS_AUTHENTICATED ? `
            <form method="post" action="${starUrl}" class="star-form" style="display: inline-block;">
                {% csrf_token %}
                <button type="submit" 
                        class="button button-star${project.is_starred ? " is-starred" : ""}"
                        title="${project.star_count > 0 ? 'Starred by ' + project.starred_by_names : 'Be the first to star'}">
                    <span aria-hidden="true">★</span>
                    ${project.is_starred ? "Unstar" : "Star"}
                    <span class="star-count">${project.star_count}</span>
                </button>
            </form>` : '';

        const manageHtml = CAN_CHANGE ? `
            <a href="${editUrl}" class="button button-secondary">Edit Project</a>
            <form method="post" action="${deleteUrl}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="button button-danger" onclick="return confirm('Are you sure you want to delete this project?');">Delete</button>
            </form>` : '';

        const completeCardHtml = `
            <div class="project-card">
                <div class="project-card-header">
                    <div class="stars-left">
                        <img src="{% static 'img/projects-star.svg' %}" alt="*" class="star-large">
                        <img src="{% static 'img/projects-star.svg' %}" alt="*" class="star-small">
                    </div>
                    <h3 class="project-title">
                        <a href="${demoLink}" target="_blank">${project.title}</a>
                    </h3>
                    <div class="stars-right">
                        <img src="{% static 'img/projects-star.svg' %}" alt="*" class="star-small">
                        <img src="{% static 'img/projects-star.svg' %}" alt="*" class="star-large">
                    </div>
                </div>
                <div class="project-card-body">
                    <div class="project-image-placeholder">
                        <img src="${imageSrc}" alt="${project.title}" class="project-image">
                    </div>
                    <div class="project-info">
                        <h4 class="project-subtitle">About</h4>
                        <p class="project-desc">${project.description}</p>
                        <h4 class="project-tech-title">Tech Stack</h4>
                        <ul class="project-tech-list">
                            <li>${project.tech_stack}</li>
                        </ul>
                        <div class="project-actions" style="margin-top: 1rem; display: flex; gap: 10px; align-items: center;">
                            ${starFormHtml}
                            ${manageHtml}
                        </div>
                    </div>
                </div>
            </div>
        `;

        slideElement.innerHTML = completeCardHtml;
        return slideElement;
    }

    // Initialize/Re-initialize Swiper
    let projectSwiperInstance = null;
    function initOrUpdateSwiper() {
        if (projectSwiperInstance) {
            projectSwiperInstance.update();
        } else {
            projectSwiperInstance = new Swiper(".projectsSwiper", {
                loop: false,
                grabCursor: true,
                spaceBetween: 50,
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                observer: true,
                observeParents: true,
            });
        }
    }

    // Fetch project data
    async function fetchProjects(searchQuery = "") {
        if (projectsAbortController) projectsAbortController.abort();
        projectsAbortController = new AbortController();

        try {
            displayPageSection({ showLoading: true });
            
            const url = searchQuery ? `${BASE_PROJECTS_ENDPOINT}?title=${encodeURIComponent(searchQuery)}` : BASE_PROJECTS_ENDPOINT;
            
            const response = await fetch(url, {
                headers: { 'Accept': 'application/json' },
                signal: projectsAbortController.signal,
            });

            if (!response.ok) throw new Error('Failed to fetch data');

            const projectData = await response.json();

            if (projectData.length === 0) {
                displayPageSection({ showEmpty: true });
            } else {
                if(gridContainer) gridContainer.innerHTML = '';
                projectData.forEach(item => {
                    gridContainer.appendChild(buildProjectCardElement(item));
                });
                displayPageSection({ showGrid: true });
                
                // Re-initialize swiper after DOM updates
                initOrUpdateSwiper();
            }
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error('Error loading projects:', error);
            displayPageSection({ showError: true });
        }
    }

    function searchProjects() {
        if (searchInput) fetchProjects(searchInput.value.trim());
    }

    if (searchInput) {
        searchInput.addEventListener("input", function() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(function() {
                searchProjects();
            }, SEARCH_DEBOUNCE_DELAY);
        });
    }

    // Search form event handler
    if (searchForm) {
        searchForm.addEventListener('submit', function(event) {
            event.preventDefault();
            clearTimeout(searchDebounceTimer);
            searchProjects();
        });
    }

    // Run when DOM is ready
    document.addEventListener("DOMContentLoaded", function () {
        // Folder open animation
        const folder = document.getElementById("projects-folder");
        if (folder) {
            folder.addEventListener("click", function (e) {
                if (e.target.closest('.project-header-controls')) return;
                if (!this.classList.contains("is-open")) {
                    this.classList.add("is-open");
                }
            });
        }

        // Fetch Initial Data
        fetchProjects(searchInput ? searchInput.value.trim() : "");
    });
</script>
{% endblock content %}
