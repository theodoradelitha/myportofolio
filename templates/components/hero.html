{% load static %}
<!-- HERO SECTION-->
<section class="hero" id="cover">
    <!-- Background stars -->
    <img src="{% static 'img/bg-star-blur.svg' %}" class="star-bg star-left" alt="" aria-hidden="true">
    <img src="{% static 'img/bg-star-blur.svg' %}" class="star-bg star-right" alt="" aria-hidden="true">

    <div class="hero-content">
        <h2 class="hero-subtitle">Welcome to my</h2>
        <img src="{% static 'img/portfolio-title.svg' %}" alt="PORTFOLIO" class="hero-title-img">

        <!-- Chips Container -->
        <div class="hero-chips-container">
            <span class="chip">Front-End Developer</span>
            <span class="chip">UI/UX Design</span>
            <span class="chip">UX Researcher</span>
        </div>
    </div>
</section>
